
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login - Makkal Nagar</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #123b70;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #bdc7d1;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 24px;
            background: #123b70;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #0b2b54;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            color: #c0392b;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #123b70;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>Makkal Nagar</h2>
    <p class="subtitle">Admin & Department Staff Login</p>

    <form id="adminLoginForm" action="/login" method="post">

        <label for="username">Username</label>
        <input type="text" id="username"
               name="username" required>

        <label for="password">Password</label>
        <input type="password" id="password"
               name="password" required>

        <button type="submit">Login</button>

    </form>

    <p id="message"></p>

    <a href="index.html" class="back">Back to Home</a>

</div>

<script>
    const params = new URLSearchParams(window.location.search);

    if (params.has("error")) {
        document.getElementById("message").textContent =
            "Invalid username or password. Please try again.";
    }

    if (params.has("logout")) {
        document.getElementById("message").textContent =
            "You have successfully logged out.";
    }
</script>

</body>
</html>
